services:
  remote-ctrl:
    image: ghcr.io/umberto-casaburi/remote-ctrl:latest
    container_name: remote-ctrl
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # The web app. Embedded RDP and VNC sessions are served through it, so
      # Guacamole's own port stays inside the container.
      - "4000:4000"
      # Built-in VPN (Enterprise): uncomment this line and cap_add below.
      # - "51820:51820/udp"
    # cap_add:
    #   - NET_ADMIN
    volumes:
      - remote-ctrl-data:/data

volumes:
  remote-ctrl-data:
